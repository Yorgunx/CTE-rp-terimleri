<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0c0c">
<meta name="color-scheme" content="dark">
<title>TACHI | Kurallar ve Terimler</title>
<meta name="description" content="TACHI rol kuralları, terimler, hiyerarşi ve dizilim komutları rehberi.">
<meta property="og:type" content="website">
<meta property="og:title" content="TACHI | Kurallar ve Terimler">
<meta property="og:description" content="Rol kuralları, terimler, hiyerarşi ve dizilim komutları tek yerde.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c0c0c'/%3E%3Ctext x='32' y='47' font-size='44' text-anchor='middle' font-family='Consolas,monospace' font-weight='700' fill='%23ff69b4'%3E%23%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0c0c0c;
    --panel: rgba(255,255,255,.035);
    --line: rgba(255,105,180,.22);
    --pink: #ff69b4;
    --white: #ffffff;
    --muted: #b9b9c2;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(255,105,180,.16), transparent 60%),
      radial-gradient(700px 400px at 100% 0%, rgba(255,255,255,.05), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--white);
    font-family: Consolas, "Cascadia Mono", "Courier New", monospace;
    line-height: 1.55;
    min-height: 100vh;
  }
  a { color: inherit; }

  /* Üst çubuk */
  .top {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px clamp(16px, 4vw, 40px);
    background: rgba(12,12,12,.72);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; letter-spacing: .3em; }
  .brand b { color: var(--pink); font-weight: 700; }
  .top small { color: var(--muted); letter-spacing: .12em; }

  main { max-width: 1120px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px) 60px; }

  /* Giriş */
  .hero { padding: clamp(36px, 8vw, 80px) 0 28px; }
  .eyebrow { color: var(--pink); letter-spacing: .3em; font-size: 12px; }
  h1 {
    margin: 10px 0 12px;
    font-size: clamp(26px, 5.5vw, 54px);
    line-height: 1.1;
    letter-spacing: .04em;
    background: linear-gradient(90deg, var(--pink), var(--white));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 16px rgba(255,105,180,.3));
  }
  .lead { margin: 0 0 24px; color: var(--muted); max-width: 60ch; }

  .search { position: relative; max-width: 560px; }
  .search input {
    width: 100%;
    font: inherit;
    color: var(--white);
    background: rgba(12,12,12,.8);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 52px 14px 16px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .search input::placeholder { color: #7d7d88; }
  .search input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255,105,180,.18); }
  .search kbd {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font: inherit;
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1px 8px;
  }

  /* Filtre çipleri */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 6px; }
  .chip {
    font: inherit;
    font-size: 13px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    transition: color .2s, border-color .2s, background .2s;
  }
  .chip:hover { color: var(--white); border-color: var(--pink); }
  .chip[aria-pressed="true"] { color: #0c0c0c; background: var(--pink); border-color: var(--pink); font-weight: 700; }
  .chip:focus-visible, .search input:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }

  #count { color: var(--muted); font-size: 13px; margin: 14px 0 0; min-height: 1.5em; }

  /* Bölümler ve kartlar */
  section.group { margin-top: 38px; }
  section.group h2 {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin: 0 0 16px;
    font-size: clamp(16px, 2.4vw, 20px);
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  section.group h2::before { content: "#"; color: var(--pink); }
  section.group h2 span { color: var(--muted); font-size: 12px; letter-spacing: .08em; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    transition: border-color .2s, box-shadow .2s, transform .2s;
    animation: rise .5s ease both;
    animation-delay: calc(var(--i, 0) * 35ms);
  }
  .card:hover {
    border-color: var(--pink);
    box-shadow: 0 0 24px rgba(255,105,180,.16);
    transform: translateY(-2px);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .badge {
    display: inline-block;
    margin-bottom: 8px;
    padding: 2px 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--pink);
    border: 1px solid var(--pink);
    border-radius: 999px;
    background: rgba(255,105,180,.08);
  }
  .card h3 { margin: 0 0 6px; font-size: 17px; letter-spacing: .03em; }
  .card p { margin: 0; color: var(--muted); font-size: 14.5px; }
  .art {
    margin: 14px 0 0;
    padding: 12px 14px;
    overflow-x: auto;
    color: var(--pink);
    font-size: 15px;
    line-height: 1.3;
    background: rgba(12,12,12,.7);
    border: 1px solid var(--line);
    border-radius: 10px;
    text-shadow: 0 0 8px rgba(255,105,180,.4);
  }
  .empty { margin-top: 40px; color: var(--muted); text-align: center; }
  .empty[hidden] { display: none; }

  footer {
    border-top: 1px solid var(--line);
    padding: 22px clamp(16px, 4vw, 40px);
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: .08em;
  }
  footer b { color: var(--pink); font-weight: 400; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .card { animation: none; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand">TACH<b>I</b></div>
  <small>KURALLAR VE TERİMLER</small>
</header>

<main>
  <div class="hero">
    <div class="eyebrow">RESMİ REHBER</div>
    <h1>KURALLAR VE TERİMLER</h1>
    <p class="lead">Rol kuralları, terimler, hiyerarşi, dizilim ve sayım komutları tek sayfada. Aradığın şeyi yazarak bulabilirsin.</p>
    <label class="search">
      <input id="q" type="search" placeholder="Ara: RDM, hiyerarşi, wedge..." autocomplete="off" aria-label="Ara">
      <kbd aria-hidden="true">/</kbd>
    </label>
    <div class="chips" id="chips" role="toolbar" aria-label="Kategoriler"></div>
    <p id="count" aria-live="polite"></p>
  </div>

  <div id="out"></div>
  <p class="empty" id="empty" hidden>Sonuç bulunamadı. Başka bir kelime dene.</p>
</main>

<footer>TACHI &middot; Developed by <b>RYN</b> &middot; <span id="yr"></span></footer>
<noscript><p style="text-align:center;color:#ff69b4">Bu sayfa için JavaScript gerekli.</p></noscript>

<script>
  /* ---------- İçerik: buradan düzenle ---------- */
  const CATS = [
    { id: "rol",       name: "Rol İhlalleri" },
    { id: "terim",     name: "Genel Terimler" },
    { id: "hiyerarsi", name: "Hiyerarşi ve Altın Kurallar" },
    { id: "dizilim",   name: "Dizilim Formasyonları" },
    { id: "sayim",     name: "Sayım Komutları" }
  ];

  const ITEMS = [
    // --- Rol ihlalleri ---
    { cat: "rol", title: "Fear RP",
      text: "Rol içinde kaçırıldığında ya da tehdit edildiğinde gerçek hayattaki gibi korkmayıp, duruma uygun tepki vermemek." },
    { cat: "rol", abbr: "RK", title: "Revenge Kill",
      text: "Seni öldüren kişiden, canlandıktan sonra tekrar gelip intikam almak yasaktır." },
    { cat: "rol", title: "Fail RP",
      text: "Rol içinde yapılamayacak hareketleri yaparak rolü bozmak." },
    { cat: "rol", title: "Non-RP",
      text: "Rol yapmayıp serbest dolaşmak (freeroam) ile vakit geçirmek." },
    { cat: "rol", title: "Refuse RP",
      text: "Role girmeyi reddetmek." },
    { cat: "rol", title: "Copbait",
      text: "Polise karşı rol içinde yapılamayacak hareketleri yaparak onu kasıtlı olarak tahrik etmek." },
    { cat: "rol", title: "Metagaming",
      text: "Rol dışında öğrenilen bilgileri role dahil ederek rolü bozmak." },
    { cat: "rol", abbr: "NLR", title: "New Life Rule",
      text: "Öldükten sonra önceki hayatı unutup yeni bir hayata başlamak." },
    { cat: "rol", abbr: "PG", title: "Power Gaming",
      text: "Gerçek hayatta yapılamayacak şeyleri oyunda yapmak." },
    { cat: "rol", abbr: "RDM", title: "Random Deathmatch",
      text: "Sebepsiz ve rolsüz bir şekilde birini öldürmek." },
    { cat: "rol", abbr: "VDM", title: "Vehicle Deathmatch",
      text: "Sebepsiz ve rolsüz bir şekilde araçla birine çarpmak veya onu ezmek." },
    { cat: "rol", title: "Combat Logging",
      text: "Çatışma, kovalamaca ya da rol sırasında rolden kaçmak için oyundan çıkmak." },
    { cat: "rol", title: "Bug Abuse",
      text: "Oyundaki ya da sunucudaki bir açığı kendi çıkarın için kullanmak." },
    { cat: "rol", title: "Troll RP",
      text: "Rolü ciddiye almadan, diğer oyuncuları amaçsızca rahatsız edip keyiflerini kaçırmak." },

    // --- Genel terimler ---
    { cat: "terim", abbr: "ERP", title: "Erotik RP",
      text: "Erotik içerikli rol." },
    { cat: "terim", abbr: "IC", title: "In Character",
      text: "Rol içi. Karakterin ağzından konuşulan ve yaşanan her şey." },
    { cat: "terim", abbr: "OOC", title: "Out Of Character",
      text: "Rol dışı. Oyuncunun kendi kimliğiyle konuştuğu ve davrandığı durumlar." },

    // --- Hiyerarşi ve altın kurallar ---
    { cat: "hiyerarsi", title: "Hiyerarşi",
      text: "Bir toplulukta yer alan kişileri alt-üst ilişkilerine ve yetkilerine göre sınıflandıran sistem." },
    { cat: "hiyerarsi", abbr: "ALTIN KURAL", title: "Emire İtaat",
      text: "Üst rütbeden gelen emir yerine getirilir." },
    { cat: "hiyerarsi", abbr: "ALTIN KURAL", title: "Saygı",
      text: "Tüm oyunculara ve personele karşı saygılı davranılır." },

    // --- Dizilim ---
    { cat: "dizilim", abbr: "STS", title: "Omuz Omuza Düz Çizgi",
      text: "Personel omuz omuza, düz çizgide durur.",
      art: "#  #  #  #  #" },
    { cat: "dizilim", abbr: "SFL", title: "Tek Sıra Dizilme",
      text: "Tek sıra hâlinde dizilinir. Kimin rütbesi yüksekse en öndedir.",
      art: "#  <- en yüksek rütbe\n#\n#\n#" },
    { cat: "dizilim", abbr: "WEDGE", title: "Üçgen (V) Dizilim",
      text: "Üçgen (V) şeklinde dizilinir. Omuza göre rütbe önemlidir.",
      art: "      #\n     # #\n    #   #\n   #     #" },

    // --- Sayım ---
    { cat: "sayim", title: "JJ",
      text: "Sayı sırayla söylenir.",
      art: "BİR İKİ ÜÇ DÖRT BEŞ" },
    { cat: "sayim", title: "GJ",
      text: "Sayı sırayla söylenir.",
      art: "BİR İKİ ÜÇ DÖRT BEŞ" },
    { cat: "sayim", title: "HJ",
      text: "Önce harfler tek tek, ardından sayı bütün olarak söylenir.",
      art: "b i r  BİR\ni k i  İKİ" }
  ];

  /* ---------- Arama ve listeleme ---------- */
  const out = document.getElementById("out");
  const qEl = document.getElementById("q");
  const chipsEl = document.getElementById("chips");
  const countEl = document.getElementById("count");
  const emptyEl = document.getElementById("empty");
  let activeCat = "all";

  // Türkçe harfleri ve büyük/küçük farkını yok sayarak karşılaştır
  const norm = s => s.toLocaleLowerCase("tr").normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "").replace(/ı/g, "i");

  const haystack = ITEMS.map(it => norm([it.abbr, it.title, it.text, it.art].filter(Boolean).join(" ")));

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function render() {
    const q = norm(qEl.value.trim());
    out.textContent = "";
    let shown = 0, idx = 0;

    CATS.forEach(cat => {
      if (activeCat !== "all" && activeCat !== cat.id) return;
      const list = ITEMS.filter((it, n) => it.cat === cat.id && (!q || haystack[n].includes(q)));
      if (!list.length) return;

      const sec = el("section", "group");
      const h2 = el("h2", "", cat.name);
      h2.appendChild(el("span", "", list.length + " madde"));
      sec.appendChild(h2);

      const grid = el("div", "grid");
      list.forEach(it => {
        const card = el("article", "card");
        card.style.setProperty("--i", idx++);
        if (it.abbr) card.appendChild(el("span", "badge", it.abbr));
        card.appendChild(el("h3", "", it.title));
        card.appendChild(el("p", "", it.text));
        if (it.art) {
          const pre = el("pre", "art", it.art);
          pre.setAttribute("aria-label", "Örnek: " + it.art.replace(/\n/g, " "));
          card.appendChild(pre);
        }
        grid.appendChild(card);
        shown++;
      });
      sec.appendChild(grid);
      out.appendChild(sec);
    });

    emptyEl.hidden = shown > 0;
    countEl.textContent = q ? shown + " sonuç bulundu" : "";
  }

  function buildChips() {
    const mk = (id, label, n) => {
      const b = el("button", "chip", n === undefined ? label : label + " (" + n + ")");
      b.type = "button";
      b.setAttribute("aria-pressed", String(id === activeCat));
      b.addEventListener("click", () => {
        activeCat = id;
        [...chipsEl.children].forEach(c => c.setAttribute("aria-pressed", String(c === b)));
        render();
      });
      return b;
    };
    chipsEl.appendChild(mk("all", "Tümü", ITEMS.length));
    CATS.forEach(c => chipsEl.appendChild(mk(c.id, c.name, ITEMS.filter(i => i.cat === c.id).length)));
  }

  qEl.addEventListener("input", render);
  // "/" tuşu aramaya odaklanır, Esc temizler
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); }
    else if (e.key === "Escape" && document.activeElement === qEl) { qEl.value = ""; render(); qEl.blur(); }
  });

  document.getElementById("yr").textContent = new Date().getFullYear();
  buildChips();
  render();
</script>
</body>
</html>
